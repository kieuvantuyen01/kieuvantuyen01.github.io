name: Sync Google Scholar Publications

on:
  # Runs at 00:00 UTC on the 1st of every month
  schedule:
    - cron: '0 0 1 * *'
  # Allows manual triggering from GitHub Actions UI anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-scholar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Google Scholar Sync Script
        run: |
          python3 scripts/sync_scholar.py

      - name: Commit and Push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --staged --quiet; then
            echo "No changes found in Google Scholar publications."
          else
            git commit -m "chore(scholar): monthly sync publications from Google Scholar [skip ci]"
            git push origin master
            echo "Successfully committed and pushed updated publications."
          fi
